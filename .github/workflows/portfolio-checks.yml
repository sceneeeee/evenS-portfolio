name: Portfolio checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck and Astro validation
        run: npm run check
      - name: Build static site
        run: npm run build
      - name: Verify bilingual routes, links and evidence
        run: npm run check:i18n
